[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: requires SentenceTransformer / ML model (skippable in fast CI)
    e2e: end-to-end pipeline test requiring all components
    unit: pure Python unit test, no ML models
    medspacy: requires medspaCy + QuickUMLS (UMLS db) — heaviest tier, skip in fast CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = -v --tb=short
